<!DOCTYPE html>
<html lang="pt-BR">

  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Encontre sua próxima leitura. Explore o catálogo, busque por título ou autor e descubra livros com sinopses semelhantes.">
  <meta property="og:title" content="Recomendador Semântico de Livros">
  <meta property="og:description" content="Explore o catálogo e descubra novas leituras a partir de um livro que desperta seu interesse.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">

</head>
<body>
  <header class="topo">
    <a class="logo" href="#" aria-label="Recomendador Semântico de Livros — Página inicial"><span aria-hidden="true">📚</span><span class="marca">Recomendador Semântico de Livros<small>Descubra novas leituras</small></span></a>
    <div class="busca">
      <label for="campo" class="so-leitor">Buscar livro por título ou autor</label>
      <input id="campo" type="search" placeholder="Busque por título ou autor" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" role="combobox" aria-expanded="false" aria-controls="sugestoes" aria-autocomplete="list">
      <ul id="sugestoes" role="listbox" aria-label="Sugestões de livros" hidden></ul>
    </div>
  </header>

  <div id="aviso" class="so-leitor" role="status" aria-live="polite"></div>

  <main id="app">
    <div class="esqueleto" aria-hidden="true"><div class="sk-hero"></div>
      <div class="sk-fila"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <p class="so-leitor">Carregando o catálogo de livros...</p>
  </main>

  <footer><strong>Recomendador Semântico de Livros</strong><br>Projeto acadêmico de Álgebra Linear e Processamento de Linguagem Natural</footer>

  <noscript><p class="vazio" style="text-align:center">Ative o JavaScript para usar o site.</p></noscript>
